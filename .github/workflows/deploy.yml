name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    # 매일 아침 한국시간 7시 (UTC 22시)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # 스케줄(schedule) 또는 수동(workflow_dispatch) 실행 시 공공데이터 수집
      - name: Fetch Public Data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/fetch-public-data.js
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 스케줄(schedule) 또는 수동(workflow_dispatch) 실행 시 블로그 글 자동 생성
      - name: Generate Blog Post
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/generate-blog-post.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # 스케줄(schedule) 또는 수동(workflow_dispatch) 실행 시 변경사항 커밋 & 푸시
      - name: Commit and Push Changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "자동 업데이트: 공공데이터 수집 및 블로그 글 생성"
            git push
            echo "NEW_POST_CREATED=true" >> $GITHUB_ENV
          else
            echo "No changes to commit"
            echo "NEW_POST_CREATED=false" >> $GITHUB_ENV
          fi

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=my-local-info-seongnam
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 아침 실행 시 성공 알림 전송
      - name: Send Telegram Notification (Success)
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/send-telegram.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_STATUS: success

      # 오류 발생 시 즉시 실패 알림 전송
      - name: Send Telegram Notification (Failure)
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: node scripts/send-telegram.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_STATUS: fail
